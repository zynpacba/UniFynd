<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFynd — Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <main class="auth-layout">
        <!-- Left Panel -->
        <aside class="auth-visual">
            <a href="landing_page.html" class="auth-brand">UniFynd<span>.</span></a>
            <div class="auth-visual-content">
                <svg class="auth-illustration" viewBox="0 0 330 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="20" y="20" width="290" height="200" rx="50" fill="#64CCC5" opacity="0.16"/>
                    <g opacity="0.85">
                        <circle cx="115" cy="110" r="49" stroke="#FFB84C" stroke-width="12" fill="#64CCC5" fill-opacity="0.35"/>
                        <path d="M81 146 L47 180" stroke="#FFB84C" stroke-width="13" stroke-linecap="round"/>
                        <text x="115" y="126" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="700">?</text>
                    </g>
                    <g opacity="0.85">
                        <circle cx="230" cy="85" r="37" stroke="#F8F6F0" stroke-width="9" fill="#64CCC5" fill-opacity="0.30"/>
                        <path d="M255 113 L280 139" stroke="#F8F6F0" stroke-width="10" stroke-linecap="round"/>
                        <text x="230" y="97" text-anchor="middle" fill="#FFFFFF" font-size="34" font-weight="700">?</text>
                    </g>
                </svg>
                <h2> Find it. Match it.<br><span>Take it back.</span></h2>
                <span>Made for campus communities</span>
            </div>
        </aside>

        <!-- Right Panel -->
        <section class="auth-panel">
            <a href="landing_page.html" class="back-home">&larr; Back to home</a>
            <div class="auth-form-container">
                <h1>Join UniFynd!</h1>
                <p class="auth-subtitle">Create an account and connect with your campus.</p>
                <form class="auth-form" method="post">
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" autocomplete="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                        <small>Use at least 8 characters.</small>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm_password" placeholder="Repeat your password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
                </form>
                <p class="auth-switch">Already have an account? <a href="login.html"> Log In</a></p>
            </div>
        </section>

    </main>

</body>
</html>
